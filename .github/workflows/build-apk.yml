name: 构建过期提醒 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: 在线构建 APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: 设置 JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: 赋予 gradlew 执行权限
      run: chmod +x gradlew

    - name: 构建 foss 版 APK
      run: ./gradlew assembleFossDebug -PbuildFoss=true --no-daemon

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: 过期提醒-APK
        path: app/build/outputs/apk/foss/debug/*.apk
        if-no-files-found: error
